# ============================================================
# Fishera Balıkçılık | Olta Ayarları
# Developer: Sythel
# ============================================================
#

#   max-weight → Yakalanabilecek maksimum balık ağırlığı
#   max-rarity → Yakalanabilecek en yüksek nadirlik
#   min/max-wait → Balığın vurması için bekleme süresi
#   weight → Daha ağır balık yakalama avantajı
#   speed → Daha kısa bekleme süresi
#   luck → Nadir balık şansını artırır
#   sell → Balık satış gelirini artırır
#
# ------------------------------------------------------------
# max-weight
# ------------------------------------------------------------
#
# Oltanın taşıyabileceği en yüksek balık ağırlığıdır.
#
# Örnek:
#   max-weight: 50
#
# 50 KG'dan ağır bir balık bu oltayla yakalanamaz.
#
#
# ------------------------------------------------------------
# max-rarity
# ------------------------------------------------------------
#
# Oltanın yakalayabileceği en yüksek balık nadirliğidir.
#
# Kullanılabilen nadirlikler:
#
#   COMMON
#   UNCOMMON
#   RARE
#   EPIC
#   LEGENDARY
#
# Örneğin:
#
#   max-rarity: EPIC
#
# Bu oltayla Legendary balık yakalanmaz.
#
# ------------------------------------------------------------
# min-wait / max-wait
# ------------------------------------------------------------
#
# Balığın oltaya vurması için beklenecek süreyi belirler.
# Değerler saniye cinsindendir.
#
# Örneğin:
#
#   min-wait: 3
#   max-wait: 7
#
# Balık, 3 ile 7 saniye arasında rastgele bir sürede vurur.
#
# ------------------------------------------------------------
# weight
# ------------------------------------------------------------
#
# Yakalanan balıkların ağırlığını etkiler.
#
# Değer yükseldikçe balıkların ağırlığı kendi aralığının
# üst tarafına doğru kayar. Daha ağır balıklar daha yüksek
# satış fiyatına sahip olacağı için bu özellik gelirini de artırır.
#
# Örnek:
#
#   weight: 0
#
# Normal ağırlık dağılımı.
#
#   weight: 300
#
# Balıklar ortalama olarak daha ağır gelir.
#
#   weight: 1000
#
# Balıkların maksimum ağırlığa yaklaşma ihtimali oldukça artar.
#
# ------------------------------------------------------------
# speed
# ------------------------------------------------------------
#
# Balığın oltaya vurmasını hızlandırır.
#
# Speed arttıkça bekleme süresi kısalır.
#
# Örneğin:
#
#   speed: 0
#
# Hız bonusu yoktur.
#
#   speed: 50
#
# Yaklaşık 5 saniyelik bir hız bonusu sağlar.
#
#   speed: 100
#
# Yaklaşık 10 saniyelik bir hız bonusu sağlar.
#
# Çok yüksek değerlerde bile bekleme süresi güvenli bir
# minimum değerin altına düşmez.
#
# ------------------------------------------------------------
# luck
# ------------------------------------------------------------
#
# Daha nadir balıkları yakalama şansını etkiler.
#
# Luck arttıkça yaygın balıkların ağırlığı azalırken,
# nadir balıkların ağırlığı artar.
#
# Kısaca:
#
#   COMMON      ↓
#   UNCOMMON    ↓
#   RARE        ↑
#   EPIC        ↑
#   LEGENDARY   ↑
#
# Bu özellik doğrudan bir balığın Chance değerini değiştirmez;
# mevcut şanslara ek bir etki uygular.
#
# ------------------------------------------------------------
# sell
# ------------------------------------------------------------
#
# Yakalanan balıkların satış gelirine yüzde olarak bonus verir.
#
# Örneğin:
#
#   sell: 10
#
# Balıklar %10 daha fazla fiyata satılır.
#
#   sell: 50
#
# Balıklar %50 daha fazla fiyata satılır.
#
# Hesaplama:
#
#   Son Fiyat = Hesaplanan Fiyat × (1 + sell / 100)
#
#
# ============================================================

