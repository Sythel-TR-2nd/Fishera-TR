# ============================================================
# Fishera Balıkçılık | Görev Ayarları
# Developer: Sythel
# ============================================================
#
# Görevler bu dosyadaki sıraya göre ilerler.
#
# Bir görevin ödülü alınmadan sonraki göreve geçilmez.
#
# ------------------------------------------------------------
# type
# ------------------------------------------------------------
#
# Görevin türünü belirler.
#
# type yazılmazsa otomatik olarak:
#
#   CATCH_FISH
#
# kabul edilir.
#
# ------------------------------------------------------------
# fish
# ------------------------------------------------------------
#
# Görevin belirli bir balığı istemesini sağlar.
#
# fish belirtilmezse yakalanan herhangi bir balık göreve
# ilerleme kazandırır.
#
# Örneğin:
#
#   fish: salmon
#
# yazılırsa yalnızca "salmon" ID'sine sahip balıklar
# bu görevin ilerlemesini artırır.
#
# ------------------------------------------------------------
# Görev sırası
# ------------------------------------------------------------
#
# Görevler YAML'da yazıldıkları sırayla oynanır.
#
# Bir görev tamamlandığında hemen sonraki göreve geçilmez.
# Önce mevcut görevin ödülü alınmalıdır.
#
# Ödül alındıktan sonra sıradaki görev açılır.
#
# ============================================================

